name: Mod kit

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check kit integrity
        shell: pwsh
        run: ./tools/Test-Kit.ps1

      - name: Build player ZIP
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          ./tools/Build-Release.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: hp1-vr-kit
          path: dist/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Download **HP1-VR-V31-$env:GITHUB_REF_NAME.zip** below, extract the whole ZIP, and run **Install.cmd**. You also need your own copy of the 2001 PC game and the dependencies listed in the README. The .sha256 file lets you check the download."
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*).FullName --title "HP1 VR V31 ($env:GITHUB_REF_NAME)" --notes $notes

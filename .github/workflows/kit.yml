name: Mod kit

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, e.g. v31.0.0 (leave empty for a test build)'
        required: false
      prerelease:
        description: 'Mark the release as a prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check kit integrity
        shell: pwsh
        run: ./tools/Test-Kit.ps1

      - name: Build player ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } elseif ($env:GITHUB_REF_TYPE -eq 'tag' -or $env:GITHUB_EVENT_NAME -eq 'release') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          ./tools/Build-Release.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: hp1-vr-kit
          path: dist/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag' || github.event_name == 'release' || inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          $notes = "Download **HP1-VR-V31-$tag.zip** below, extract the whole ZIP, and run **Install.cmd**. You also need your own copy of the 2001 PC game and the dependencies listed in the README. The .sha256 file lets you check the download."
          $files = (Get-ChildItem dist/*).FullName
          # A release made on github.com already exists for this tag: attach the ZIP to it.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            $ghArgs = @($tag) + $files + @('--target', $env:GITHUB_SHA, '--title', "HP1 VR V31 ($tag)", '--notes', $notes)
            if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
            gh release create @ghArgs
          }

; HP1 VR V30 | Startup settings
; ============================================================================
; Edit the file beside the launcher you use, save it, then restart the game.
; Lines starting with ; are notes, not active settings.
; To undo an edit, restore the default shown beside that setting below.
;
; Looking for height, world scale, turning speed or wand placement?
; Use the VR calibration menu: left Y + right grip.
; Left stick up/down selects a row; left/right adjusts its value.
; Those settings are saved separately in the runtime's VR/V30Calibration.ini.
; This file does not enable/disable the V30 updates as a group.

[Render]
; WORLD CLARITY | Trial: 1280; previous working value: 1024
; Square resolution per eye: 1024 means 1024 x 1024.
;   1024 = V30 clarity setting (more detail, more rendering work).
;    896 = middle option if 1024 feels less smooth.
;    768 = previous resolution, useful for comparing performance.
;    640 = lowest supported setting.
; 1280 = 1.56x previous pixels; 1536 = 2.25x previous pixels.
; Whole numbers from 640 to 1536 are accepted; invalid values use 1024.
; Menu resolution stays 1024 x 768. This does NOT change world scale or height.
WorldSize=1280

[Engine]
; GAME FRAME-RATE LIMIT | Default: Auto (recommended)
; Auto targets half the headset refresh, limited to 30-60 game frames/sec.
; Examples: 72 Hz headset -> 36; 90 Hz -> 45; 120 Hz -> 60.
; This does not set your headset refresh rate or guarantee achieved FPS.
; A number from 30 to 240 overrides Auto, but higher caps can disrupt pacing
; and the original game's audio. Leave Auto for normal play.
MaxTickHz=Auto

[Menu]
; MAIN-MENU ARTWORK LANGUAGE | Default: empty (stock US/English logo)
; Optional: enter a folder name from Multilanguage_Main_Menu_v2.
; This selects menu artwork, not a full game/dialogue translation.
Language=

[Flags]
; Bounded per-character texture/path census for the visual quality pass.
TEXTURE_AUDIT=1
; GPU scheduling experiment stays isolated from the production potion fixes.
READBACK_EARLY_SUBMIT=0
READBACK_ORDER=-1
; Present one eye in the game window for desktop spectators.
DESKTOP_MIRROR=1
; ADVANCED OVERRIDES | Normally leave this section alone.
; These are applied after the settings above and can override them.
; Names automatically receive the HP1VR_ prefix; an empty value clears the
; corresponding environment override. Only recognized flags have an effect.

; OLD BAKED CURSOR | Keep at 0.
; Disables the obsolete cursor drawn into game frames. The updated smoothed
; menu dot, ray endpoint and hit-testing remain active and aligned.
BAKED_MENU_CURSOR=0

; BROOMSTICK VR CONTROL | Default: 1 in this build
; Turns on VR flying at broom lessons and any other time Harry is on a broom.
; It switches the game to its own broom input channel and stops the walking
; controls fighting it. Steering mode, sensitivity, pitch direction and dead
; zone are in the calibration menu, under Broomstick Flight.
; Set to 0 to fly exactly as the previous build did, for comparison.
BROOM=1

; BROOM STEERING SMOOTHING | Default: 12 (= 0.12 seconds)
; How long the broom takes to follow a change in your hand or stick, in
; HUNDREDTHS of a second. The pointing modes need this: they turn a tracked
; angle into a turn RATE, and the game adds that rate up over time, so a shaky
; hand becomes a wobble that never settles. Larger is calmer and later; smaller
; is sharper and twitchier. Any NEGATIVE value turns it off completely.
; BROOM_SMOOTHING=12

; Flight uses the broom's own PitchLimitUp / PitchLimitDown, not the chase
; camera's walking look limits. BROOM_PITCH_UNLOCK is obsolete and ignored.
; Release pitch to level out. The game continuously flies forward; brake
; slows down rather than hovering. Head-look does not steer.
; POINT mode: aim the RIGHT controller away from its captured neutral to
; turn/climb/dive. Hold BOTH grips for 0.75 seconds to recapture neutral.

; OPTIONAL SUBTITLES
; To request native subtitles in both eyes, remove the ; from the next line.
; SHOW_SUBTITLES=1
;
; Troubleshooting only: add diagnostic flags here when investigating a specific
; issue. Desktop-mirror and forced-lesson test modes are not normal play options.
; Optional Harry body: toggle it in the live calibration menu. Default OFF.
; Detailed replacement water is enabled; the procedural-water crash guard stays.

[Paths]
; Portable runtime beside this launcher.
Runtime=Runtime
